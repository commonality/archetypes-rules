image: Visual Studio 2026
environment:
  GH_TOKEN:
    secure: 1nsZPoMsZopgW0XtFNZdjuzxWvw8EcheaCS6H3B8zYM1ihueWRMc1hdUdeHyg9TM
  GITHUB_ACCESS_TOKEN:
    secure: 1nsZPoMsZopgW0XtFNZdjuzxWvw8EcheaCS6H3B8zYM1ihueWRMc1hdUdeHyg9TM
  matrix:
    - nodejs_version: '26'
    - nodejs_version: '24'
    - nodejs_version: '22'
    - nodejs_version: '20'
install:
  - ps: Install-Product node $env:nodejs_version
  - npm i npm@latest -g
  - npm ci
matrix:
  fast_finish: true
build: false
shallow_clone: true
clone_depth: 1
test_script:
  - node --version
  - npm --version
  - cd %APPVEYOR_BUILD_FOLDER%
  - npx jest --coverage --ci --reporters=jest-junit --testResultsProcessor=jest-sonar-reporter
