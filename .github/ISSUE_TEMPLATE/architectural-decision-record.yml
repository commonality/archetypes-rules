name: "Architectural Decision Record (ADR)"
description: |
  An Architectural Decision Record (ADR) is a justified software design
  document that addresses a functional or non-functional requirement of
  architectural significance with underlying rationale.
title: "adr({scope}): {short title, representative of solved problem and found solution}"
type: Task
labels: ["needs triage"]

body:
  - type: markdown
    attributes:
      value: |
        ## Before you start

        Please search our [existing ADRs](https://gitlab.com/zaira-ardor-llc/architecture/adr) to lessen the change of filing duplicate issues or feature requests. Thank you.

        ---

  - type: dropdown
    id: adr-status
    attributes:
      label: Status
      description: |
        - Proposed: An architecture decision nominated for acceptance or
        rejection.
        - Accepted: An architecture decision that has been approved, with provision.
        - Rejected: An unwanted or infeasible architecture decision.
        - Deprecated/Superseded by: This architecture decision has been
          withdrawn in favor of a newer alternative / A newer decision that replaces a deprecated ADR.
      multiple: false
      options:
        - Proposed
        - Accepted
        - Rejected
        - Deprecated/Superseded by
      default: 0
  - type: input
    id: adr-decision-date
    attributes:
      label: "![Decision date](https://cdnjs.cloudflare.com/ajax/libs/octicons/8.3.0/svg/calendar.svg) Decision date"
      description: "The date this architectural decision was made, in ISO 8601 format."
      placeholder: "2026-11-18"
    validations:
      required: true
  - type: textarea
    id: adr-context
    attributes:
      label: Context & problem statement
      description: Describe the context and problem statement, e.g., in free form using two to three sentences or in the form of an illustrative story. You may want to articulate the problem in form of a question and add links to collaboration boards or issue management systems.
      placeholder: |
        We want to record architectural decisions made in this project independent
        whether decisions concern the architecture ("architectural decision record"),
        the code, or other fields. Which format and structure should these records
        follow?
    validations:
      required: true
  - type: textarea
    id: adr-decision-drivers
    attributes:
      label: Decision drivers
      description: |
        A list motivations for this architectural decision.

        > [!TIP]
        >
        > This is an optional element.

      placeholder: |
        1. {decision driver 1, e.g., a force, facing concern, …}
        2. {decision driver 2, e.g., a force, facing concern, …}
        3. … <!-- numbers of drivers can vary -->
    validations:
      required: true
  - type: textarea
    id: adr-considered-options
    attributes:
      label: Considered options
      description: A list of choices that may solve the problem.
      placeholder: |
        1. {title of option 1}
        2. {title of option 2}
        3. {title of option 3}
        4. {title of option 4}
        5. … <!-- numbers of options can vary -->
    validations:
      required: true
  - type: textarea
    id: adr-decision-outcome
    attributes:
      description: A clear and concise description of the final architectural decision.
      label: Decision outcome
      placeholder: |
        Chosen option: "{title of option 1}", because {justification. e.g., only option, which meets k.o. criterion decision driver | which resolves force {force} | … | comes out best (see below)}.
    validations:
      required: true
  - type: textarea
    id: adr-consequences
    attributes:
      label: Consequences
      description: |
        Software architectural decisions are high-impact choices that define a
        system’s long-term structure and behavior, carrying consequences that
        extend across technical, operational, and organizational domains. Such
        decisions are characterized by their long-term impact, the difficulty or
        expense of reversal, and their influence on multiple components,
        necessitating careful trade-off analysis.

        > [!NOTE]
        >
        > This section is optional.

        Describe the effects that this decision has current technology, quality,
        organization(s), and business.
      placeholder: |
        1. Good, because {positive consequence, e.g., improvement of one or more
        desired qualities, …}
        2. Bad, because {negative consequence, e.g., compromising one or more
        desired qualities, …}
        3. … <!-- numbers of consequences can vary -->
    validations:
      required: false
  - type: textarea
    id: adr-confirmation
    attributes:
      label: Confirmation
      placeholder: |
        Describe how the implementation of/compliance with the ADR can/will be
        confirmed. Are the design that was decided for and its implementation in
        line with the decision made? E.g., a design/code review or a test with a
        library such as ArchUnit can help validate this.

        > [!NOTE]
        >
        > Note that although we classify the "Confirmation" section as optional,
        > it is customary to include it in many ADRs.
    validations:
      required: false
  - type: textarea
    id: adr-options-pros-cons
    attributes:
      label: Pros & cons of the options
      description: |
        List the pros and cons of
      placeholder: |
        ### {title of option 1}

        <!-- This is an optional element. Feel free to remove. -->
        {example | description | pointer to more information | …}

        * Good, because {argument a}
        * Good, because {argument b}
        <!-- use "neutral" if the given argument weights neither for good nor bad -->
        * Neutral, because {argument c}
        * Bad, because {argument d}
        * … <!-- numbers of pros and cons can vary -->

        ### {title of other option}

        {example | description | pointer to more information | …}

        * Good, because {argument a}
        * Good, because {argument b}
        * Neutral, because {argument c}
        * Bad, because {argument d}
        * …
  - type: textarea
    id: adr-more-info
    attributes:
      label: More Information
      description: You might want to provide additional evidence/confidence for the decision outcome here and/or document the team agreement on the decision and/or define when/how this decision the decision should be realized and if/when it should be re-visited. Links to other decisions and resources might appear here as well.
    validations:
      required: false
  - type: textarea
    id: adr-decision-makers
    attributes:
      label: Decision makers
      description: "List everyone involved in this decision"
      placeholder: |
        1. @gregswindle
        2. @zaira-ardor
        3. [Somebody Else w/out a GitHub account](mailto:somebody.else@example.com)
        4. …
    validations:
      required: false
  - type: textarea
    id: adr-consulted
    attributes:
      label: Consultants
      description: "list everyone whose opinions are sought (typically subject-matter experts); and with whom there is a two-way communication"
      placeholder: |
        1. @gregswindle
        2. @zaira-ardor
        3. [Somebody Else w/out a GitHub account](mailto:somebody.else@example.com)
        4. …
    validations:
      required: false
  - type: textarea
    id: adr-informed
    attributes:
      label: Informed parties
      description: "list everyone who is kept up-to-date on progress; and with whom there is a one-way communication"
      placeholder: |
        1. @gregswindle
        2. @zaira-ardor
        3. [Somebody Else w/out a GitHub account](mailto:somebody.else@example.com)
        4. …
    validations:
      required: false
