name: "test-reporter"
on: ["push"]

permissions:
  checks: write
  pull-requests: write

jobs:
  codacy-coverage-reporter:
    runs-on: ubuntu-latest
    name: Test and code coverage report
    environment: codacy-variables
    env:
      CODACY_ORGANIZATION_PROVIDER: ${CODACY_ORGANIZATION_PROVIDER}
      CODACY_PROJECT_NAME: ${CODACY_PROJECT_NAME}
      CODACY_PROJECT_TOKEN: ${CODACY_PROJECT_TOKEN}
      CODACY_USERNAME: ${CODACY_USERNAME}
      COVERAGE_ARTIFACT_PATH: /tmp/codacy-coverage-*.json
      COVERAGE_REPORT_PATH: ./coverage/lcov.info
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node@lts/*
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: 'pnpm'
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: |
          pnpm ci:test
          if [ -f "${{ env.COVERAGE_REPORT_PATH }}" ]; then
            echo "ⓘ File \"${{ env.COVERAGE_REPORT_PATH }}\" exists"
          else
            echo "⚠︎ Could not find file \"${{ env.COVERAGE_REPORT_PATH }}\""
          fi
      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          comment: true
          detailed_summary: true
          failed_summary: true
          fail_on_failure: true
          include_passed: true
          include_time_in_summary: true
          pr_id: ${{ github.event.pull_request.number }}
          report_paths: './junit.xml'
          require_passed_tests: true
      - name: Evaluate coverage reports・Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ env.COVERAGE_REPORT_PATH }}
          language: JavaScript
      - name: Publish coverage results to Codacy
        run: |
          curl -X POST https://api.codacy.com/2.0/gh/commonality/archetypes-rules/commit/${GITHUB_SHA}/coverage/JavaScript \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json'
