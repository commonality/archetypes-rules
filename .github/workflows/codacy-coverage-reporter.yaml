name: "Codacy Coverage Reporter"
run-name: Code coverage report・Codacy
on: ["push"]
jobs:
  codacy-coverage-reporter:
    runs-on: ubuntu-latest
    name: codacy-coverage-reporter
    environment: codacy-variables
    env:
      CODACY_ORGANIZATION_PROVIDER: ${CODACY_ORGANIZATION_PROVIDER}
      CODACY_PROJECT_NAME: ${CODACY_PROJECT_NAME}
      CODACY_PROJECT_TOKEN: ${CODACY_PROJECT_TOKEN}
      CODACY_USERNAME: ${CODACY_USERNAME}
      COVERAGE_ARTIFACT_PATH: /tmp/codacy-coverage-*.json
      COVERAGE_REPORT_PATH: ./coverage/lcov.info
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
      - name: Run codacy-coverage-reporter
        shell: bash
        run: |
          npm install -g npm@latest
          npm ci
          npm test
          cat ./coverage/lcov.info
          if [ -f "${{ COVERAGE_REPORT_PATH }}" ]; then
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
              -r ${{ COVERAGE_REPORT_PATH }}
              --force-coverage-parser=lcov \
              --language=JavaScript \
              --organization-provider=gh \
              --project-name=archetypes-rules \
              --project-token="${{ secrets.CODACY_PROJECT_TOKEN }}" \
              --username=commonality \
              final
          else
            echo "Could not find a coverage report."
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-results
          path: ${COVERAGE_ARTIFACT_PATH}

        # uses: codacy/codacy-coverage-reporter-action@v1.3.0
