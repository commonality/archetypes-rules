name: "Tests & Coverage"
description: "Behavior-Driven Development creates unit tests and reports for business stakeholders and technical teams by focusing on the expected behavior of software from a user's perspective."
on: ["push"]

permissions:
  checks: write
  pull-requests: write

jobs:
  codacy-coverage-reporter:
    runs-on: ubuntu-latest
    name: Test and code coverage report
    environment: codacy-variables
    env:
      CODACY_ORGANIZATION_PROVIDER: ${CODACY_ORGANIZATION_PROVIDER}
      CODACY_PROJECT_NAME: ${CODACY_PROJECT_NAME}
      CODACY_PROJECT_TOKEN: ${CODACY_PROJECT_TOKEN}
      CODACY_USERNAME: ${CODACY_USERNAME}
      COVERAGE_ARTIFACT_PATH: /tmp/codacy-coverage-*.json
      COVERAGE_REPORT_PATH: ./coverage/lcov.info
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0
      - name: Setup node@lts/*
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: 'pnpm'
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: |
          pnpm ci:test
          if [ -f "${{ env.COVERAGE_REPORT_PATH }}" ]; then
            echo "ⓘ File \"${{ env.COVERAGE_REPORT_PATH }}\" exists"
          else
            echo "⚠︎ Could not find file \"${{ env.COVERAGE_REPORT_PATH }}\""
          fi
      - name: Upload test artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          # Artifact name. If the `archive` input is `false`, the name of the
          # file uploaded will be the artifact name.
          name: # optional, default is artifact
            unit-test-artifacts # A file, directory or wildcard pattern that describes what to upload.
          path: |
            ./coverage/clover.xml
            ./coverage/lcov.info
            ./junit.xml

          # if-no-files-found: # optional, default is warn Duration after which
          # artifact will expire in days. 0 means using default retention.
          # Minimum 1 day. Maximum 90 days unless changed from the repository
          # settings page.

          retention-days:
            1
            # optional
          # The level of compression for Zlib to be applied to the artifact
          # archive. The value can range from 0 to 9: - 0: No compression - 1:
          # Best speed - 6: Default compression (same as GNU Gzip) - 9: Best
          # compression Higher levels will result in better compression, but
          # will take longer to complete. For large files that are not easily
          # compressed, a value of 0 is recommended for significantly faster
          # uploads.

          # compression-level: # optional, default is 6 If true, an artifact
          # with a matching name will be deleted before a new one is uploaded.
          # If false, the action will fail if an artifact for the given name
          # already exists. Does not fail if the artifact does not exist.

          # overwrite: # optional, default is false If true, hidden files will
          # be included in the artifact. If false, hidden files will be excluded
          # from the artifact.

          # include-hidden-files: # optional, default is false If true, the
          # artifact will be archived (zipped) before uploading. If false, the
          # artifact will be uploaded as-is without archiving. When `archive` is
          # `false`, only a single file can be uploaded. The name of the file
          # will be used as the artifact name (ignoring the `name` parameter).

          # archive: # optional, default is true
      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v6.7.1
        # uses:
        # mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce
        # # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          comment: true
          detailed_summary: true
          failed_summary: true
          fail_on_failure: true
          include_passed: true
          include_time_in_summary: true
          pr_id: ${{ github.event.pull_request.number }}
          report_paths: './junit.xml'
          require_passed_tests: true
      - name: Evaluate coverage reports・Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        # uses:
        # codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        # # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ env.COVERAGE_REPORT_PATH }}
          language: JavaScript
      - name: Publish coverage results to Codacy
        run: |
          curl -X POST https://api.codacy.com/2.0/gh/commonality/archetypes-rules/commit/${GITHUB_SHA}/coverage/JavaScript \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json'
