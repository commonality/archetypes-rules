name: verify-and-release
on:
  push:
    branches:
      - main # or master

permissions:
  contents: read # for checkout

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout・GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm・GitHub
        uses: pnpm/action-setup@v4
      - name: Setup Node.js・GitHub
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies・GitHub
        run: |
          pnpm run ci:audit:prod
          pnpm audit signatures
          pnpm run ci:outdated
      - name: Run lint, tests, and other verification
        run: pnpm run ci:test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout・GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm・GitHub
        uses: pnpm/action-setup@v4
      - name: Setup node@lts/*・GitHub
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: 'pnpm'
      - name: Install dependencies・GitHub
        run: |
          pnpm install --frozen-lockfile
      - name: Release with semantic-release・GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          chmod +x ./.github/ci/.githooks/* # ⬅︎ ① Ensure our git hooks are executable
          git config core.hooksPath ./.github/ci/.githooks # ⬅︎ ② Make git use our hooks
          git config --global init.defaultBranch main # ⬅︎ ③ Default branch is main
          pnpm run semantic-release # ⬅︎ ④ Create a GitHub release
