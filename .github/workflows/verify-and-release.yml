name: Verify and Release
on:
  push:
    branches:
      - main # or master

permissions:
  contents: read # for checkout

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: |
          npm i -g npm@latest
          npm clean-install
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: |
          npm run ci:audit:prod
          npm audit signatures
          npm run ci:outdated
      - name: Run lint, tests, and other verification
        run: npm run ci:test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: |
          npm i -g npm@latest
          npm clean-install
      - name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          chmod +x ./.github/ci/.githooks/* # ⬅︎ ① Ensure our git hooks are executable
          git config core.hooksPath ./.github/ci/.githooks # ⬅︎ ② Make git use our hooks
          git config --global init.defaultBranch main # ⬅︎ ③ Default branch is main
          npm run semantic-release # ⬅︎ ④ Create a GitHub release
