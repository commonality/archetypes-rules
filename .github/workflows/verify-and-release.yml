name: "DPRV"
description: "Delegated Product Release Verification (DPRV) is a process where an agent is authorized to act on behalf of a delegating organization to verify and release products or services."
on:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

jobs:
  verify:
    name: 'Verify: Dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - name: Setup package manager・PNPM
        uses: pnpm/action-setup@v4.3.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: |
          pnpm ci:audit:prod
          pnpm audit signatures
          pnpm ci:outdated

  release:
    name: 'Release: NPM'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup package manager・PNPM
        uses: pnpm/action-setup@v4.3.0
      - name: Setup node@lts/*
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # ① Default branch is main
          git config --global init.defaultBranch main
          # ② Create a GitHub release
          pnpm semantic-release
